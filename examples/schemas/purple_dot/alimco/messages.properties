# Purple Dot email copy overrides — PARTIAL override of the bundled email copy.
# Source of truth: the "Standard Events & Notifications" email content sheet
# (Done-status rows only). Keys absent here fall back to the instance file
# (EMAIL_MESSAGES_PATH), then the bundled defaults
# (apps/api/src/notifications/email/messages.default.properties — full key list).
#
# Placeholders are {{likeThis}} and optional; unrecognised ones render as
# literal text. Values are single-line HTML fragments (<p> <b> <a> allowed).
# See docs/operations/email-copy-overrides.md for the layering rules.
#
# Sign-off note: action emails get their "Thanks, Team <name>" from the CTA
# shell using the deployment's INSTANCE_NAME — set INSTANCE_NAME=ALIMCO on
# Purple Dot deployments. Plain emails (OTP/welcome/guardian) carry the sign-off
# in the copy below.

# ── Login OTP (signin + signup share this template) ──────────────────
login.otp.subject=OTP to verify access
login.otp.body=<p>Hi!</p><p>Use the following One-Time Password (OTP) to sign in to {{siteLink}}:</p>{{otpBox}}<p style="font-size: 13px; color: #555;">This OTP is valid for 5 mins. Do not share it with anyone.</p><p>- Team ALIMCO</p>

# ── Welcome (new user created) ───────────────────────────────────────
welcome.subject=Welcome to Purple Dot – Complete your profile to get started
welcome.body=<p>Hi!</p><p>You have successfully registered on Purple Dot. You are one step away from finding jobs and services near you.</p><p>Complete your profile to get job matches that are right for you.</p><p>{{siteLink}}</p><p>Thanks<br/>Team ALIMCO</p>
welcome.seeker.subject=Welcome to Purple Dot – Complete your profile to get started
welcome.seeker.body=<p>Hi!</p><p>You have successfully registered on Purple Dot. You are one step away from finding jobs and services near you.</p><p>Complete your profile to get job matches that are right for you.</p><p>{{siteLink}}</p><p>Thanks<br/>Team ALIMCO</p>
welcome.provider.subject=Welcome to Purple Dot – Complete your profile to get started
welcome.provider.body=<p>Hi!</p><p>You have successfully registered on Purple Dot. You are one step away from offering your services near you.</p><p>Complete your profile to start connecting with the right people.</p><p>{{siteLink}}</p><p>Thanks<br/>Team ALIMCO</p>

# ── Connect — Seeker to Provider (recipient = seeker) ────────────────
action.connect.seeker.inbound_request.body=<p>{{name}} is interested in connecting with you. They may have an opportunity that is right for you.</p><p>Click below to view the details and respond.</p>
action.connect.seeker.outbound_request.body=<p>Your connection request has been sent to {{name}}. They have been notified. You can track the status here.</p>
action.connect.seeker.inbound_status.body=<p>{{name}} has responded to your connection request. Check the update and take the next step.</p>
action.connect.seeker.outbound_status.body=<p>Your response to {{name}} has been sent. They have been notified. You can track the status here.</p>

# ── Connect — Provider to Seeker (recipient = provider) ──────────────
action.connect.provider.inbound_request.subject=A seeker is interested in your service
action.connect.provider.inbound_request.body=<p>A Seeker is interested in the service you are offering and wants to connect with you.</p><p>Click below to view their details and respond.</p>
action.connect.provider.outbound_request.subject=Your connection request has been sent to the seeker
action.connect.provider.outbound_request.body=<p>Your connection request has been sent to the seeker. They have been notified. You can track the status here.</p>
action.connect.provider.inbound_status.body=<p>The seeker has responded to your connection request. Check the update and take the next step.</p>
action.connect.provider.outbound_status.body=<p>Your response has been sent to the seeker. They have been notified. You can track the status here.</p>

# ── Apply/Shortlist — Seeker to Provider (recipient = seeker) ────────
action.apply.seeker.inbound_request.body=<p>{{name}} has reviewed your profile and taken an action. This could be an important step towards your next opportunity.</p><p>Click below to view what they have done and respond.</p>
action.apply.seeker.outbound_request.body=<p>Your application has been sent to {{name}}. They have been notified. You can track the status here.</p>
action.apply.seeker.inbound_status.body=<p>{{name}} has responded to your application. Check the update to know your next step.</p>
action.apply.seeker.outbound_status.body=<p>Your response has been sent to {{name}}. They have been notified. You can track the status here.</p>

# ── Apply/Shortlist — Provider to Seeker (recipient = provider) ──────
action.apply.provider.inbound_request.subject=A job seeker has applied to the opportunity you posted
action.apply.provider.inbound_request.body=<p>A job seeker has applied for the opportunity you are offering. Review their profile and take the next step.</p>
action.apply.provider.outbound_request.subject=Your shortlisting action has been sent to the job seeker
action.apply.provider.outbound_request.body=<p>Your shortlisting action has been sent to the job seeker. They have been notified. You can track the status here.</p>
action.apply.provider.inbound_status.subject=The job seeker has responded to your shortlisting action
action.apply.provider.inbound_status.body=<p>The job seeker has responded to your shortlisting action. Check the update and take the next step.</p>
action.apply.provider.outbound_status.subject=Your response has been sent to the job seeker
action.apply.provider.outbound_status.body=<p>Your response has been sent to the job seeker. They have been notified. You can track the status here.</p>

# ── Guardian OTP (U18) ───────────────────────────────────────────────
# Sheet places the sign-off before the OTP box for these.
guardian.account.body=<p>Hi {{parentName}},</p><p>Your ward has requested registration on <b>{{domain}}</b>. This website shows services and opportunities relevant to your ward. Use the given OTP to agree to create their account.</p>{{otpBox}}<p style="font-size: 13px; color: #555;">This OTP is valid for 10 minutes. Do not share it with anyone.</p><p>Thanks<br/>Team ALIMCO</p>
guardian.profile.subject=OTP to verify access of your ward
guardian.profile.body=<p>Hi {{parentName}},</p><p>Your ward has requested to create a profile on <b>{{domain}}</b>. This profile will help your ward in discovering, and matching to relevant services and opportunities. Use the given OTP to agree to create their profile.</p>{{otpBox}}<p style="font-size: 13px; color: #555;">This OTP is valid for 10 minutes. Do not share it with anyone.</p><p>Thanks<br/>Team ALIMCO</p>
guardian.action.subject=OTP to share information of your ward
guardian.action.body=<p>Hi {{parentName}},</p><p>Your ward has requested to connect to <b>{{org}}</b>. This will share your ward's profile details, along with name, phone, and email with the organisation. Use the given OTP to allow <b>{{org}}</b> to access your ward's details.</p>{{otpBox}}<p style="font-size: 13px; color: #555;">This OTP is valid for 10 minutes. Do not share it with anyone.</p><p>Thanks<br/>Team ALIMCO</p>
