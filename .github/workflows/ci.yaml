name: CI

on:
  pull_request:
    branches: [develop, main, feature]
  # feature: validate the merged integration state too — PRs into feature
  # already run CI, but the post-merge result was unchecked. publish-images
  # stays develop-only via its own `if` gate.
  #
  # main: required for SonarCloud. The organization's plan analyses the MAIN
  # branch only (branch/PR analysis is a paid feature), so without a push
  # trigger here the default branch is never scanned and the dashboard reports
  # `"main" branch has not been analyzed yet` no matter how many PRs land.
  # publish-images is gated to develop by its own `if`, so main pushes only
  # run the checks + the sonar scan.
  push:
    branches: [develop, feature, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec tsc --noEmit

  typecheck-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    # Runs `pnpm -r test` across all workspaces. Packages without their
    # own test suites use a no-op `echo "no tests yet"` script so the
    # workspace-recursive run stays green.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  sonar:
    runs-on: ubuntu-latest
    # Runs the full workspace test suite with coverage enabled, then feeds
    # every package's lcov.info to the SonarCloud scan (paths declared in
    # sonar-project.properties). continue-on-error on the coverage run: a
    # red test here is already caught by the `test` job above — we still
    # want the scan to run with whatever coverage numbers exist so the
    # SonarCloud dashboard doesn't go stale on an unrelated flaky test.
    #
    # The api suite is run TWICE and both lcov files are reported:
    #   1. the default (unit-only) run — vitest.config.ts excludes
    #      *.integration.test.ts because those need a live stack;
    #   2. the integration run against real Postgres + Redis.
    # Without (2), the ~25 integration suites' coverage counts for nothing even
    # though the tests exist and pass, which understated api coverage
    # substantially. Integration coverage is written to a SEPARATE directory so
    # the two lcov files don't overwrite each other; SonarCloud merges the
    # per-file hit counts across reportPaths.
    #
    # Postgres must be the repo's own image (docker/postgres) rather than a
    # stock one: the schema needs pgvector AND postgis, which
    # postgres:*-alpine ships neither of. It's built and run here as a plain
    # container instead of a `services:` entry, because services: cannot use an
    # image built earlier in the same job.
    env:
      # Non-secret, throwaway values for an ephemeral CI database. AUTH_SECRET
      # and INSTANCE_SHARED_SECRET only need to satisfy their length checks;
      # SIGNALS_PII_KEY must be base64-encoded 32 bytes (AES-256).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_ci_pw
      POSTGRES_DB: postgres
      POSTGRES_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_ci_pw
      INSTANCE_NAME: ci
      INSTANCE_ENV: development
      API_DOMAIN: localhost
      API_PORT: 2742
      AUTH_SECRET: ci-auth-secret-value
      INSTANCE_SHARED_SECRET: ci-instance-shared-secret-at-least-32-chars
      SIGNALS_PII_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NETWORK_CONFIG_SOURCE: local
      SCHEMA_REGISTRY_URL: http://127.0.0.1:9999
      SERVED_DOMAINS: blue_dot/seeker
      # Job-level, not step-level: a step's own `env:` isn't visible to its own `if:`.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- (1) unit coverage across every workspace ----------------------
      # Uses each package's dedicated `test:coverage` script (`vitest run
      # --coverage`). Do NOT use `pnpm -r run test -- --coverage`: pnpm appends
      # `-- --coverage`, and vitest reads everything after `--` as a positional
      # test-name FILTER, so `--coverage` never enables coverage and no lcov is
      # written — SonarCloud then imports 0% (overall AND new code).
      - name: Unit tests with coverage (all workspaces)
        run: pnpm -r run test:coverage
        continue-on-error: true

      # --- (2) api integration coverage against a real stack -------------
      - name: Start Redis
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:7.2-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"

      - name: Build and start Postgres (pgvector + postgis)
        run: |
          docker build -t dpg-ci-db ./docker/postgres
          docker run -d --name ci-db -p 5432:5432 \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB="$POSTGRES_DB" \
            dpg-ci-db

      - name: Wait for Postgres and Redis
        run: |
          for i in $(seq 1 45); do
            if docker exec ci-db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
            if [ "$i" = 45 ]; then echo "::error::Postgres never became ready"; docker logs ci-db; exit 1; fi
          done
          for i in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              echo "redis ready"; break
            fi
            sleep 2
            if [ "$i" = 30 ]; then echo "::error::Redis never became ready"; docker logs ci-redis; exit 1; fi
          done

      - name: Apply schema (Drizzle push, then the raw SQL bundle)
        # Mirrors local dev (scripts/db_init.ts): the Drizzle-owned tables go in
        # first, then the bundle adds the partitioned/vector layer that FKs to
        # them. The real image has pgvector + postgis, so unlike schema-parity
        # nothing needs stripping here.
        run: |
          pnpm --filter api exec drizzle-kit push --force
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:5432/$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -f apps/api/db/postgres/schema.sql

      - name: API integration tests with coverage
        # Separate reportsDirectory so this lcov does not clobber the unit one.
        # continue-on-error for the same reason as the unit run: keep the scan
        # reporting rather than going stale on one flaky suite.
        run: |
          pnpm --filter api exec vitest run \
            --config vitest.integration.config.ts \
            --coverage.enabled \
            --coverage.provider=v8 \
            --coverage.reporter=lcov \
            --coverage.reportsDirectory=./coverage-integration
        continue-on-error: true

      - name: Show which lcov reports were produced
        # Cheap guard against silently scanning with a missing report: if a
        # coverage step failed, the file is absent and the number would quietly
        # drop rather than error.
        if: always()
        run: |
          for f in apps/api/coverage/lcov.info apps/api/coverage-integration/lcov.info \
                   apps/ui/coverage/lcov.info packages/auth/coverage/lcov.info \
                   packages/config/coverage/lcov.info packages/schemas/coverage/lcov.info; do
            if [ -f "$f" ]; then echo "found  $f ($(wc -l < "$f") lines)";
            else echo "::warning::missing $f — its coverage will not be counted"; fi
          done

      - name: Stop containers
        if: always()
        run: docker rm -f ci-db ci-redis || true

      # SONAR_TOKEN is unavailable on Dependabot/fork pull_request runs (GitHub
      # withholds repo secrets from them); skip rather than fail so those PRs
      # don't show a red check for something they have no way to fix.
      # SONAR_TOKEN comes from the job-level `env` above — a step's own `env:`
      # block is not in scope for its own `if:`.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true

  dep-cruise:
    runs-on: ubuntu-latest
    continue-on-error: true
    # `hashFiles()` is not available in job-level `if` expressions — GitHub
    # evaluates those before the runner provisions a workspace, so there is
    # no filesystem yet. Guard at step level instead, after checkout.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Note when dep-cruise config is absent
        if: hashFiles('.dependency-cruiser.cjs') == ''
        run: echo "::notice::No .dependency-cruiser.cjs found; skipping dep-cruise."
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: hashFiles('.dependency-cruiser.cjs') != ''
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('.dependency-cruiser.cjs') != ''
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: hashFiles('.dependency-cruiser.cjs') != ''
      - run: pnpm dep-check
        if: hashFiles('.dependency-cruiser.cjs') != ''

  schema-parity:
    runs-on: ubuntu-latest
    # Schema-parity guards the local-dev SQL bundle (apps/api/db/postgres/
    # schema.sql) after #287 unified the deploy schema under one Drizzle
    # ledger. The bundle is now the RAW (non-Drizzle) layer only — the
    # partitioned item/action/event tables + item_search — applied ON TOP
    # of the Drizzle-owned tables (it FKs to "user"), NOT a standalone
    # schema. So pg-sql must get the Drizzle push FIRST, then the bundle.
    #
    # This job verifies: (a) the bundle is fresh (schema:bundle:check),
    # (b) it applies cleanly and idempotently over the Drizzle push (FKs
    # resolve), and (c) the Drizzle-managed surface is identical on both
    # DBs. The partitioned tables + item_search live in the bundle only
    # (pgTable can't model PARTITION BY / vector types), so the Diff step
    # excludes them (--exclude-table) plus the extensions they depend on
    # (cube/earthdistance/pgcrypto) via a sed strip.
    services:
      pg-sql:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      pg-drizzle:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_SQL_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_DRIZZLE_URL: postgres://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Regenerate schema bundle (must be a no-op if already fresh)
        run: pnpm schema:bundle:check

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply Drizzle push to pg-sql (creates the tables the bundle FKs to)
        # The bundle FKs items.created_by → "user"; post-#287 the Drizzle-owned
        # tables are not in the bundle, so push them here before applying it —
        # mirrors local dev (db_init.ts: db:push:api then the bundle).
        env:
          POSTGRES_URL: ${{ env.PG_SQL_URL }}
        run: pnpm --filter api exec drizzle-kit push --force

      - name: Apply bundled schema.sql to pg-sql
        run: |
          # item_search and its pgvector/postgis extensions are owned by the SQL
          # bundle but are NOT part of the drizzle-managed parity surface (like the
          # partitioned tables) and need third-party extensions absent from stock
          # postgres. Strip them before applying; they're excluded from the diff too.
          grep -vE '^CREATE EXTENSION IF NOT EXISTS (vector|postgis);' apps/api/db/postgres/schema.sql \
            | awk '/item_search \(Signals search engine/{skip=1} skip&&/WHERE lifecycle_status/{skip=0;next} skip{next} {print}' \
            > /tmp/schema_parity.sql
          psql "$PG_SQL_URL" -v ON_ERROR_STOP=1 -f /tmp/schema_parity.sql

      - name: Apply Drizzle migrations to pg-drizzle
        env:
          POSTGRES_URL: ${{ env.PG_DRIZZLE_URL }}
        run: pnpm --filter api exec drizzle-kit push --force

      - name: Diff schemas
        run: |
          # Dump pg-sql excluding partitioned tables (items, item_actions,
          # action_events). drizzle-kit doesn't manage these because
          # pgTable can't model PARTITION BY — they live in the SQL
          # bundle only. Their indexes/FKs/check-constraints dump
          # alongside the parent tables and disappear with them.
          pg_dump --schema-only --no-owner --no-privileges \
            --exclude-table=items \
            --exclude-table=item_actions \
            --exclude-table=action_events \
            --exclude-table=item_search \
            "$PG_SQL_URL" > /tmp/sql.sql
          pg_dump --schema-only --no-owner --no-privileges \
            --exclude-table=items \
            --exclude-table=item_actions \
            --exclude-table=action_events \
            --exclude-table=item_search \
            "$PG_DRIZZLE_URL" > /tmp/drizzle.sql

          # Strip extension blocks: cube, earthdistance, pgcrypto are
          # loaded by the SQL bundle for the items_geo_earth_idx and
          # uuid generation on partitioned tables. drizzle-kit doesn't
          # load them. They're known infrastructure-only objects, not
          # subject to the auth/metrics surface we're comparing.
          for f in /tmp/sql.sql /tmp/drizzle.sql; do
            for ext in cube earthdistance pgcrypto; do
              sed -i -E "/^-- Name: ${ext}; Type: EXTENSION/d" "$f"
              sed -i -E "/^-- Name: EXTENSION ${ext}; Type: COMMENT/d" "$f"
              sed -i -E "/^CREATE EXTENSION IF NOT EXISTS ${ext} /d" "$f"
              sed -i -E "/^COMMENT ON EXTENSION ${ext} /d" "$f"
            done
          done

          # Filter out per-dump security nonces (PG18+ only; defensive
          # for PG16 we're on).
          sed -i -E 's/\\(restrict|unrestrict) [A-Za-z0-9]+/\\\1 <NONCE>/' /tmp/sql.sql /tmp/drizzle.sql

          # Normalize whitespace after the extension strip: removes the
          # orphan `--` section separators that bracketed the stripped
          # CREATE/COMMENT EXTENSION blocks, and collapses any runs of
          # consecutive blank lines. pg_dump's `--` separators bracket
          # every section header symmetrically on both sides, so removing
          # all standalone `--` lines is safe — content stays.
          for f in /tmp/sql.sql /tmp/drizzle.sql; do
            sed -i -E '/^--$/d' "$f"
            # cat -s collapses runs of blank lines to a single blank
            cat -s "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          diff /tmp/sql.sql /tmp/drizzle.sql

  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI spec drift check
        run: |
          pnpm --filter api spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm --filter api spec:dump' and commit"; exit 1; }

  # Publish the :develop images (api, ui) ONLY after the blocking CI jobs pass,
  # and only on a develop push. Previously build-images.yaml triggered directly
  # on push to develop, so red tests still shipped :develop images. Gating this
  # inside the CI run (needs the checks below) closes that gap with no
  # default-branch/workflow_run caveat. Release images (main, v* tags) and
  # manual runs stay in build-images.yaml. dep-cruise is continue-on-error, so
  # it is intentionally not a gate here.
  publish-images:
    needs: [typecheck-api, typecheck-ui, test, schema-parity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: ui
            context: .
            dockerfile: apps/ui/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "${{ matrix.service.dockerfile }}" ]; then
            echo "Dockerfile not found at ${{ matrix.service.dockerfile }} — skipping ${{ matrix.service.name }}"
            exit 0
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Mirrors build-images.yaml: the DHI base layers come from dhi.io, which
      # requires auth even for the free catalog. Both publish paths build the
      # same Dockerfiles, so both need this login, and it now applies to every
      # matrix entry — api and ui are both on DHI bases.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/blue-dots-economy/signals-dpg/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # Mirrors build-images.yaml. Both publish paths need this: build-images.yaml
      # covers main + v* tags, this covers the gated :develop publish — the stream
      # that ships most often, so scanning only the release path would leave the
      # busiest artifact unscanned.
      #
      # Scanned by digest: buildx pushes to the registry without loading into the
      # local docker image store, so `imageid` is not resolvable by Trivy here.
      - name: Trivy image scan
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/blue-dots-economy/signals-dpg/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never blocks the :develop publish

      - name: Upload Trivy image SARIF
        if: always() && steps.build.outputs.digest != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-image.sarif
          # One category per image so api and ui alerts don't overwrite each other.
          category: trivy-image-${{ matrix.service.name }}
