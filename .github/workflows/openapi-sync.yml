name: OpenAPI sync → bluedots-docs

on:
  push:
    branches: [main]
    paths: [openapi.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Blue-Dots-Economy/bluedots-docs
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: docs-repo

      - name: Copy spec into docs repo
        run: cp openapi.json docs-repo/src/openapi/signals-dpg.json

      # No-op when the JSON is byte-identical: create-pull-request opens no PR
      # if the copy produced no diff, and updates the existing PR otherwise.
      - name: Open or update sync PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: docs-repo
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          branch: openapi-sync/signals-dpg
          title: 'openapi-sync: signals-dpg'
          commit-message: 'chore: sync signals-dpg OpenAPI spec from source repo'
          body: |
            Automated OpenAPI sync from `Blue-Dots-Economy/signals-dpg` (`${{ github.sha }}`).
            Review the contract diff, then merge to publish on the docs site.
