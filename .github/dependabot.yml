version: 2

# Docker Hardened Image bases live on dhi.io, which refuses anonymous pulls — so
# without this Dependabot cannot read the manifests and base-image update PRs for
# any Dockerfile using `FROM dhi.io/...` simply stop appearing. Nothing errors,
# which is what makes it worth being explicit about.
#
# PREREQUISITE: these are DEPENDABOT secrets, a separate store from Actions
# secrets — set them under Settings > Secrets and variables > Dependabot.
# Note the username must be a secret here: Dependabot registry config cannot
# reference `vars`, which is what the Actions workflows use for it.
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}
updates:
  # npm/pnpm — one entry at the workspace root covers all packages because
  # pnpm-lock.yaml holds the full dependency graph for the monorepo.
  - package-ecosystem: "npm"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

    ignore:
      # typescript-eslint does not support TS 7 yet — hold the major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest 4 needs vite 6 in lockstep — hold the major.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # better-auth 1.7 breaks two contracts we'd have to migrate: SecondaryStorage
      # gained required `getAndDelete`/`increment`, and `verifyApiKey` left the
      # inferred API surface (#604). It is being removed once integrating DPGs move
      # from `x-api-key` to Keycloak client-credentials bearer tokens, so the
      # migration is deliberately deferred rather than done. Minor is held as well
      # as major because the break shipped in a *minor* (1.6 -> 1.7); patches on the
      # 1.6 line still land, which matters — `verifyApiKey` is still on the api-key
      # auth path even under AUTH_PROVIDER=keycloak. Both packages are listed
      # because they peer-depend on each other in lockstep
      # (@better-auth/api-key@1.7.x requires better-auth ^1.7.x), so holding only
      # one would just move the failure to a peer conflict.
      # The matching `~1.6.29` pin in packages/auth/package.json is what actually
      # binds resolution; this block only stops the PRs being raised.
      - dependency-name: "better-auth"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@better-auth/api-key"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions — keeps CI workflow action versions current
  - package-ecosystem: "github-actions"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:15"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base images — one entry per directory containing a Dockerfile
  - package-ecosystem: "docker"
    # Needed to read dhi.io manifests; see the registries block at the top.
    registries:
      - dhi
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directories:
      - "/apps/api"
      - "/apps/ui"
      - "/docker/postgres"
    schedule:
      interval: "monthly"
      time: "03:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    ignore:
      # Hold base-image bumps that cross a RELEASE CHANNEL. Both were proposed
      # the moment the dhi.io registry config reached main (#618, #619) and both
      # were closed — this stops them recurring while still letting patches land.
      #
      # node: even majors are LTS. 24 is Active LTS to 2028-04-30; 26 only
      # becomes LTS on 2026-10-28. A major also has to move all 4 FROM lines
      # plus ci.yaml's node-version and root engines together, so it is a
      # deliberate PR, not a bump.
      - dependency-name: "dhi.io/node"
        update-types: ["version-update:semver-major"]
      # nginx: even MINORS are the stable branch, odd are mainline (1.30 stable
      # / 1.31 mainline). So minor is the channel-crossing one here, not major —
      # holding both keeps the UI runtime on stable while 1.30.x patches land.
      - dependency-name: "dhi.io/nginx"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
